<template>
  <style>
    #captions {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    #captions .cg {
      position: absolute;
      left: 0;
      right: 0;
      top: 1170px;
      padding: 0 130px;
      text-align: center;
      opacity: 0;
      visibility: hidden;
      overflow: visible;
      font-family: "Montserrat", sans-serif;
      font-weight: 900;
      font-size: 68px;
      line-height: 1.08;
      text-transform: uppercase;
      letter-spacing: -0.01em;
    }
    #captions .w {
      display: inline-block;
      margin: 0 10px;
      color: #ffffff;
      -webkit-text-stroke: 10px #0a0a0a;
      paint-order: stroke fill;
      text-shadow: 0 8px 22px rgba(0, 0, 0, 0.55);
    }
    #captions .w.hl {
      color: var(--brand, #ffd400);
    }
  </style>
  <div id="captions" data-composition-id="captions" data-width="1080" data-height="1920">
<!--GROUPS-->
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    // A group pops in, each word bumps as it is spoken, then a hard kill.
    function show(sel, start, end, wordTimes) {
      const g = document.querySelector(sel);
      const ws = g.querySelectorAll(".w");
      tl.set(g, { visibility: "visible" }, start);
      tl.fromTo(g, { opacity: 0, y: 26, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.16, ease: "back.out(2)" }, start);
      ws.forEach((w, i) => {
        const t = Math.max(start, wordTimes[i]);
        tl.fromTo(w, { scale: 1 }, { scale: 1.14, duration: 0.08, ease: "power2.out" }, t);
        tl.to(w, { scale: 1, duration: 0.14, ease: "power2.inOut" }, t + 0.08);
      });
      tl.to(g, { opacity: 0, duration: 0.08, ease: "power2.in" }, end - 0.08);
      tl.set(g, { opacity: 0, visibility: "hidden" }, end);
    }
//CALLS
    window.__timelines["captions"] = tl;
  </script>
</template>
