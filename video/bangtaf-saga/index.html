<!doctype html>
<html
  lang="ms"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"brand","type":"color","label":"Brand yellow","default":"#FFD400"},
    {"id":"bagBlue","type":"color","label":"Bag blue","default":"#1F7BFF"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      :root {
        --brand: #ffd400;
        --bagBlue: #1f7bff;
        --ink: #ffffff;
        --night: #0b0b0c;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--night);
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--night);
      }
      /* The camera: every cut lives inside it, punch-ins scale it around the face. */
      #cam {
        position: absolute;
        inset: 0;
        transform-origin: 560px 900px;
      }
      #cam video {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }
      #bug {
        position: absolute;
        left: 40px;
        top: 182px;
        width: 150px;
        z-index: 30;
        filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.6));
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="31"
      data-width="1080"
      data-height="1920"
    >
      <!-- ===== A-roll: six kept pieces of IMG_0155, back to back ===== -->
      <div id="cam">
        <video id="v1" class="clip" src="assets/source.mp4" data-start="0" data-duration="8.2" data-media-start="1.8667" data-track-index="0" playsinline data-has-audio="true"></video>
        <video id="v2" class="clip" src="assets/source.mp4" data-start="8.2" data-duration="1.3" data-media-start="10.6333" data-track-index="0" playsinline data-has-audio="true"></video>
        <video id="v3" class="clip" src="assets/source.mp4" data-start="9.5" data-duration="5.2333" data-media-start="14.1667" data-track-index="0" playsinline data-has-audio="true"></video>
        <video id="v4" class="clip" src="assets/source.mp4" data-start="14.7333" data-duration="5.4" data-media-start="20.0" data-track-index="0" playsinline data-has-audio="true"></video>
        <video id="v5" class="clip" src="assets/source.mp4" data-start="20.1333" data-duration="1.8333" data-media-start="25.8" data-track-index="0" playsinline data-has-audio="true"></video>
        <video id="v6" class="clip" src="assets/source.mp4" data-start="21.9667" data-duration="4.0" data-media-start="32.6667" data-track-index="0" playsinline data-has-audio="true"></video>
      </div>

      <!-- ===== Graphics ===== -->
      <img id="bug" class="clip" src="assets/logo.png" data-start="0" data-duration="25.9" data-track-index="1" alt="Bang Taf Motorsport" />
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="4.7" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 20"></div>
      <div id="chips" data-composition-id="chips" data-composition-src="compositions/chips.html" data-start="4.7" data-duration="5.3" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 20"></div>
      <div id="saga" data-composition-id="saga" data-composition-src="compositions/saga.html" data-start="9.5" data-duration="5.5" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 25"></div>
      <div id="price" data-composition-id="price" data-composition-src="compositions/price.html" data-start="15" data-duration="5.1333" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 20"></div>
      <div id="features" data-composition-id="features" data-composition-src="compositions/features.html" data-start="20.1333" data-duration="1.8333" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 20"></div>
      <div id="cta" data-composition-id="cta" data-composition-src="compositions/cta.html" data-start="21.9667" data-duration="4.0" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 20"></div>
      <div id="outro" data-composition-id="outro" data-composition-src="compositions/outro.html" data-start="25.62" data-duration="5.38" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 40"></div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="25.9667" data-track-index="4" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index: 35"></div>

      <!-- ===== Music bed: under the voice, opens up for the outro ===== -->
      <audio id="music" src="assets/music.wav" data-start="0" data-duration="31" data-track-index="5" data-volume="1" data-fade-out="1.2"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0.5},{"t":0.6,"v":0.16},{"t":25.5,"v":0.16},{"t":26.1,"v":0.45},{"t":31,"v":0.45}]}]}'></audio>

      <!-- ===== Sound effects (peaks placed one frame after the picture) ===== -->
      <audio id="sfx-hook" src="assets/sfx/impact-bass-1.mp3" data-start="0" data-duration="2.1" data-track-index="6" data-volume="0.55"></audio>
      <audio id="sfx-mak" src="assets/sfx/pop.mp3" data-start="5.913" data-duration="0.7" data-track-index="6" data-volume="0.6"></audio>
      <audio id="sfx-ayah" src="assets/sfx/click.mp3" data-start="6.403" data-duration="0.37" data-track-index="7" data-volume="0.6"></audio>
      <audio id="sfx-abang" src="assets/sfx/pop.mp3" data-start="6.973" data-duration="0.7" data-track-index="6" data-volume="0.6"></audio>
      <audio id="sfx-akak" src="assets/sfx/click.mp3" data-start="7.643" data-duration="0.37" data-track-index="7" data-volume="0.6"></audio>
      <audio id="sfx-slam" src="assets/sfx/impact-bass-1.mp3" data-start="8.12" data-duration="1.3" data-track-index="6" data-volume="0.7" data-fade-out="0.4"></audio>
      <audio id="sfx-broll-in" src="assets/sfx/whoosh.mp3" data-start="12.97" data-duration="0.57" data-track-index="6" data-volume="0.7"></audio>
      <audio id="sfx-broll-out" src="assets/sfx/whoosh-short.mp3" data-start="14.80" data-duration="0.57" data-track-index="6" data-volume="0.6"></audio>
      <audio id="sfx-price" src="assets/sfx/sparkle.mp3" data-start="16.97" data-duration="1.6" data-track-index="6" data-volume="0.55" data-fade-out="0.5"></audio>
      <audio id="sfx-pakai" src="assets/sfx/pop.mp3" data-start="18.86" data-duration="0.7" data-track-index="6" data-volume="0.55"></audio>
      <audio id="sfx-low" src="assets/sfx/pop.mp3" data-start="20.09" data-duration="0.7" data-track-index="6" data-volume="0.55"></audio>
      <audio id="sfx-jimat" src="assets/sfx/click.mp3" data-start="20.95" data-duration="0.37" data-track-index="6" data-volume="0.6"></audio>
      <audio id="sfx-cta" src="assets/sfx/whoosh-short.mp3" data-start="21.87" data-duration="0.57" data-track-index="6" data-volume="0.5"></audio>
      <audio id="sfx-tekan" src="assets/sfx/ping.mp3" data-start="24.46" data-duration="1.3" data-track-index="6" data-volume="0.45"></audio>
      <audio id="sfx-riser" src="assets/sfx/riser.mp3" data-start="22.9" data-duration="3.5" data-track-index="7" data-volume="0.3" data-fade-in="1.2"></audio>
      <audio id="sfx-wipe" src="assets/sfx/whoosh.mp3" data-start="25.49" data-duration="0.57" data-track-index="8" data-volume="0.7"></audio>
      <audio id="sfx-logo" src="assets/sfx/impact-bass-1.mp3" data-start="26.30" data-duration="2.1" data-track-index="6" data-volume="0.55"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const cam = "#cam";
      // Hook: tight, then hard punch-ins on emphasis; each jump hides the cut.
      tl.set(cam, { scale: 1.22 }, 0);
      tl.set(cam, { scale: 1.0 }, 1.1);
      tl.set(cam, { scale: 1.16 }, 3.96);
      tl.set(cam, { scale: 1.0 }, 5.2);
      // "Sampai bila?!" - fast zoom slam.
      tl.fromTo(cam, { scale: 1.05 }, { scale: 1.42, duration: 0.28, ease: "expo.out" }, 8.2);
      tl.set(cam, { scale: 1.0 }, 9.5);
      tl.to(cam, { scale: 1.12, duration: 0.6, ease: "power2.inOut" }, 12.1);
      tl.set(cam, { scale: 1.06 }, 14.7333);
      tl.set(cam, { scale: 1.2 }, 16.97);
      tl.set(cam, { scale: 1.0 }, 18.2);
      tl.set(cam, { scale: 1.0 }, 20.1333);
      tl.set(cam, { scale: 1.15 }, 20.99);
      tl.set(cam, { scale: 1.08 }, 21.9667);
      tl.set(cam, { scale: 1.22 }, 24.75);
      // Outro: zoom through the face as the yellow wipe crosses.
      tl.to(cam, { scale: 1.9, duration: 0.4, ease: "power3.in" }, 25.55);
      // Brand bug settles in after the hook text.
      tl.fromTo("#bug", { opacity: 0, y: -12 }, { opacity: 0.95, y: 0, duration: 0.4, ease: "power3.out" }, 4.6);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
